<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Мій календар{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f9;
            color: #333;
        }

        header {
            background: #2c3e50;
            padding: 20px;
        }

        header a {
            color: white;
            text-decoration: none;
            font-size: 24px;
            font-weight: bold;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #2c3e50;
        }

        h2 {
            margin-top: 0;
        }

        a {
            color: #2980b9;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
        }

        .muted {
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <a href="{% url 'events:calendar_list' %}">
        📅 Мій календар
    </a>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

</body>
</html>
